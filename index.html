<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catch Force Survey</title>
<meta name="description" content="Walk-up survey for a magnetic catch: sort letter-coded boxes, mark the acceptable range, tip test, match to familiar closures. Data stays on this device.">
<meta name="theme-color" content="#1f5fae">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='22' height='36' rx='5' fill='%231f5fae'/%3E%3Crect x='36' y='14' width='22' height='36' rx='5' fill='%23b3261e'/%3E%3Crect x='28' y='26' width='8' height='12' fill='%2399a3b3'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --text: #1c2330; --muted: #5a6474; --line: #d8dde5;
  --accent: #1f5fae; --accent-ink: #ffffff; --accent-soft: #e3ecf8;
  --good: #1d7a48; --good-soft: #e0f2e8; --bad: #b3261e; --bad-soft: #fbe5e3;
  --warn: #7a5200; --warn-soft: #fff3d6; --chip: #eef1f6; --shadow: 0 1px 2px rgba(20,30,50,.06), 0 2px 8px rgba(20,30,50,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --card: #1a2029; --text: #e6eaf0; --muted: #9aa4b4; --line: #2c3542;
    --accent: #6ea6ee; --accent-ink: #0c1420; --accent-soft: #1d2b3e;
    --good: #5fc28d; --good-soft: #17301f; --bad: #f08b81; --bad-soft: #3a1c1a;
    --warn: #f0c46a; --warn-soft: #2e2512; --chip: #232b36; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --card: #1a2029; --text: #e6eaf0; --muted: #9aa4b4; --line: #2c3542;
  --accent: #6ea6ee; --accent-ink: #0c1420; --accent-soft: #1d2b3e;
  --good: #5fc28d; --good-soft: #17301f; --bad: #f08b81; --bad-soft: #3a1c1a;
  --warn: #f0c46a; --warn-soft: #2e2512; --chip: #232b36; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
main { max-width: 760px; margin: 0 auto; padding: 16px 16px 104px; }
header.bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  max-width: 760px; margin: 0 auto; padding: 14px 16px 0;
}
header.bar h1 { font-size: 17px; margin: 0; letter-spacing: .01em; }
header.bar .meta { color: var(--muted); font-size: 13px; }
h2 { font-size: 26px; line-height: 1.25; margin: 6px 0 6px; }
h3 { font-size: 18px; margin: 18px 0 8px; }
p { margin: 6px 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); margin: 12px 0; }
.note { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 15px; margin: 10px 0; }
.warn { border-left: 3px solid var(--warn); background: var(--warn-soft); color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 15px; margin: 10px 0; }
.err { border-left: 3px solid var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 10px 12px; font-size: 15px; margin: 10px 0; }
button, .btn {
  font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); padding: 10px 14px; min-height: 48px;
}
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--bad); }
button.ghost { background: transparent; }
button:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.big-actions { display: grid; gap: 10px; }
.big-actions button { min-height: 56px; font-size: 18px; text-align: left; padding: 12px 16px; }
.hero { text-align: center; padding: 28px 18px; }
.hero h2 { font-size: 32px; }
.hero .start { font-size: 22px; min-height: 68px; padding: 14px 28px; width: 100%; max-width: 420px; margin-top: 10px; }
.consent { display: flex; gap: 12px; align-items: flex-start; text-align: left; max-width: 520px; margin: 14px auto 0; font-size: 16px; cursor: pointer; }
.consent input { width: 28px; height: 28px; flex: none; margin-top: 2px; }
.code {
  display: inline-grid; place-items: center; min-width: 52px; height: 52px; padding: 0 10px;
  border-radius: 12px; background: var(--chip); font-weight: 700; font-size: 24px; letter-spacing: .02em;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-width: 60px; min-height: 56px; font-size: 22px; font-weight: 700; border-radius: 12px;
  background: var(--chip); border: 2px solid transparent;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.sortlist { list-style: none; margin: 0; padding: 0; }
.sortlist li {
  display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--card); margin: 8px 0;
}
.sortlist li .pos { width: 26px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.sortlist li .arrows { margin-left: auto; display: flex; gap: 6px; }
.sortlist li .arrows button { width: 56px; font-size: 20px; padding: 0; }
.endlabel { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.opts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.opts button { font-size: 14px; padding: 8px 6px; line-height: 1.25; min-height: 56px; }
.opts button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
@media (max-width: 560px) { .opts { grid-template-columns: 1fr 1fr; } .opts button:last-child { grid-column: span 2; } }
.matchrow { padding: 12px 0; border-top: 1px solid var(--line); }
.matchrow:first-child { border-top: 0; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pair button { min-height: 60px; font-size: 18px; }
.pair button[aria-pressed="true"].held { background: var(--good); color: #fff; border-color: var(--good); }
.pair button[aria-pressed="true"].opened { background: var(--bad); color: #fff; border-color: var(--bad); }
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0 2px; }
.progress > i { display: block; height: 100%; background: var(--accent); }
.footer-nav {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); z-index: 5;
}
.footer-nav .inner { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
.footer-nav .inner button { flex: 1; min-height: 56px; font-size: 18px; }
.staff-link { position: fixed; right: 10px; bottom: 10px; font-size: 12px; min-height: 32px; padding: 4px 10px; opacity: .55; z-index: 4; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { border-bottom: 1px solid var(--line); padding: 7px 6px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 13px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
input[type="text"], input[type="number"], input[type="password"], textarea {
  font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 10px; width: 100%; min-height: 48px;
}
textarea { min-height: 120px; resize: vertical; }
.forcegrid { display: grid; grid-template-columns: 64px 1fr 52px; gap: 8px; align-items: center; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--chip); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
@media (max-width: 560px) { .stats { grid-template-columns: 1fr; } }
svg.chart { width: 100%; height: auto; display: block; max-width: 560px; }
svg.chart text { fill: var(--muted); font-size: 12px; font-family: inherit; }
.overlay { position: fixed; inset: 0; background: rgba(10, 14, 20, .55); display: grid; place-items: center; z-index: 10; padding: 16px; }
.overlay .card { max-width: 420px; text-align: center; }
.hidden { display: none !important; }
/* printable table labels */
.labels { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.label { border: 2px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; break-inside: avoid; background: var(--card); }
.label .L { font-size: 96px; font-weight: 800; line-height: 1; }
.label .A { font-size: 26px; font-weight: 700; }
.sign { border: 2px solid var(--text); border-radius: 14px; padding: 24px; text-align: center; margin-bottom: 16px; background: var(--card); }
.sign h2 { font-size: 34px; }
@media print {
  header.bar, .footer-nav, .staff-link, .noprint { display: none !important; }
  body { background: #fff; color: #000; }
  main { padding: 0; max-width: none; }
  .label, .sign { border-color: #000; }
  .sign { break-after: page; }
}
</style>
</head>
<body>
<header class="bar">
  <h1>Catch Force Survey</h1>
  <span class="meta" id="meta"></span>
</header>
<main id="app" aria-live="polite"></main>
<nav class="footer-nav hidden" id="nav"><div class="inner" id="navInner"></div></nav>
<button class="ghost staff-link hidden" id="staffLink" data-act="staffgate">Staff</button>
<div class="overlay hidden" id="idle" role="alertdialog" aria-labelledby="idleTitle">
  <div class="card">
    <h2 id="idleTitle">Still there?</h2>
    <p>Tap anywhere to keep going. Otherwise the survey restarts in <b id="idleCount">30</b> s and your answers are cleared.</p>
    <button class="primary" data-act="stillhere" style="width:100%">I'm still here</button>
  </div>
</div>

<script>
"use strict";
/* ---------------------------------------------------------------- storage (this device only) */
const KEY = "catchSurvey.v1";
const LETTERS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
const GRACE_S = 30;                    // "Still there?" countdown after the idle limit
const DONE_RETURN_S = 12;              // thank-you screen returns to the welcome screen
const DEFAULT = () => ({
  config: {
    codes: ["A", "B", "C", "D", "E", "F"].map(c => ({ code: c, force: "" })),
    anchors: ["Gift box", "Eyeglass case", "Cabinet catch"],
    frame: "a small box you carry and open by hand",
    pin: "",
    idleSeconds: 120,
  },
  participants: [],
  counts: { withdrawn: 0, timedOut: 0 },
});
let storageOK = true;
let db = load();

function load() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) return normalize(JSON.parse(s));
  } catch (e) { storageOK = false; }
  return DEFAULT();
}
function normalize(d) {
  const base = DEFAULT();
  if (!d || typeof d !== "object") return base;
  const c = d.config || {};
  const idle = parseInt(c.idleSeconds, 10);
  return {
    config: {
      codes: Array.isArray(c.codes) && c.codes.length ? c.codes.map(x => ({ code: String(x.code), force: x.force ?? "" })) : base.config.codes,
      anchors: Array.isArray(c.anchors) && c.anchors.length === 3 ? c.anchors.map(String) : base.config.anchors,
      frame: typeof c.frame === "string" ? c.frame : base.config.frame,
      pin: typeof c.pin === "string" ? c.pin : "",
      idleSeconds: Number.isFinite(idle) && idle >= 30 ? idle : base.config.idleSeconds,
    },
    participants: Array.isArray(d.participants) ? d.participants : [],
    counts: { withdrawn: +(d.counts && d.counts.withdrawn) || 0, timedOut: +(d.counts && d.counts.timedOut) || 0 },
  };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); storageOK = true; }
  catch (e) { storageOK = false; }
  renderMeta();
}

/* ---------------------------------------------------------------- helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const codes = () => db.config.codes.map(c => c.code);
const forceOf = code => { const c = db.config.codes.find(x => x.code === code); const v = c ? parseFloat(c.force) : NaN; return Number.isFinite(v) ? v : NaN; };
const fmtN = v => Number.isFinite(v) ? v.toFixed(2) : "–";
const nowISO = () => new Date().toISOString();
function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    let r;
    if (window.crypto && crypto.getRandomValues) { const u = new Uint32Array(1); crypto.getRandomValues(u); r = u[0] / 4294967296; } else r = Math.random();
    const j = Math.floor(r * (i + 1)); [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}
function nextId() {
  const n = db.participants.reduce((m, p) => Math.max(m, parseInt(String(p.id).replace(/\D/g, ""), 10) || 0), 0) + 1;
  return "P" + String(n).padStart(2, "0");
}
function median(xs) {
  const v = xs.filter(Number.isFinite).sort((a, b) => a - b);
  if (!v.length) return NaN;
  const m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
}
const finiteMin = xs => { const v = xs.filter(Number.isFinite); return v.length ? Math.min(...v) : NaN; };
const finiteMax = xs => { const v = xs.filter(Number.isFinite); return v.length ? Math.max(...v) : NaN; };
function matchLabels() {
  const a = db.config.anchors;
  return ["Weaker than the " + a[0].toLowerCase(), "Like the " + a[0].toLowerCase(), "Like the " + a[1].toLowerCase(),
          "Like the " + a[2].toLowerCase(), "Stronger than the " + a[2].toLowerCase()];
}
/* Kendall's tau-a between a participant's weakest-to-strongest order and the measured forces (pairs with equal force skipped). */
function kendall(order) {
  let c = 0, d = 0;
  for (let i = 0; i < order.length; i++) for (let j = i + 1; j < order.length; j++) {
    const fi = forceOf(order[i]), fj = forceOf(order[j]);
    if (!Number.isFinite(fi) || !Number.isFinite(fj) || fi === fj) continue;
    if (fj > fi) c++; else d++;
  }
  return c + d ? (c - d) / (c + d) : NaN;
}
function download(name, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const csvCell = v => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => rows.map(r => r.map(csvCell).join(",")).join("\r\n") + "\r\n";
const stamp = () => new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");

/* ---------------------------------------------------------------- view state */
let view = { name: "welcome" };
let cur = null;                       // participant in progress
let staffOpen = false;                // unlocked until "Back to the welcome screen"
let consentTicked = false;
const STEPS = ["sort", "marks", "tip", "match", "comment"];
const STAFF_VIEWS = new Set(["staff", "setup", "results", "labels"]);

function go(v) {
  if (STAFF_VIEWS.has(v.name) && !staffOpen) v = { name: "gate" };
  view = v; render(); window.scrollTo(0, 0);
}

function renderMeta() {
  const n = db.participants.length;
  $("#meta").textContent = staffOpen || view.name === "gate"
    ? n + (n === 1 ? " response" : " responses") + (storageOK ? "" : " · NOT SAVED")
    : "About 5 minutes · anonymous";
}

function nav(buttons) {
  const navEl = $("#nav");
  if (!buttons) { navEl.classList.add("hidden"); return; }
  navEl.classList.remove("hidden");
  $("#navInner").innerHTML = buttons.map(b =>
    `<button class="${b.cls || ""}" data-act="${b.act}" ${b.disabled ? "disabled" : ""}>${esc(b.label)}</button>`).join("");
}

/* ---------------------------------------------------------------- screens */
function render() {
  renderMeta();
  $("#staffLink").classList.toggle("hidden", !(view.name === "welcome" || view.name === "done"));
  const fn = { welcome: viewWelcome, gate: viewGate, staff: viewStaff, setup: viewSetup, results: viewResults,
               labels: viewLabels, run: viewRun, done: viewDone }[view.name] || viewWelcome;
  $("#app").innerHTML = fn();
  if (view.name === "run") bindRunInputs();
  if (view.name === "setup") bindSetupInputs();
  if (view.name === "welcome") bindWelcome();
  if (view.name === "gate") { const p = $("#pin"); if (p) p.focus(); }
}

/* ---- participant side */
function viewWelcome() {
  nav(null);
  const n = codes().length;
  return `
  <div class="card hero">
    <h2>How strong should a box catch be?</h2>
    <p>Help a student project choose the right pull for a magnetic catch. You'll open ${n} small boxes on this table,
       labelled ${esc(codes()[0])} to ${esc(codes()[n - 1])}, and answer a few quick questions.</p>
    <p class="muted small">About 5 minutes. No names or personal details are collected. You can stop at any time and your answers are deleted.
       The magnets can pinch: keep fingers clear of the gap.</p>
    <label class="consent"><input type="checkbox" id="consent" ${consentTicked ? "checked" : ""}>
      <span>I am 18 or older, I haven't taken this survey before, and I agree to take part.</span></label>
    <button class="primary start" data-act="start" ${consentTicked ? "" : "disabled"}>Start</button>
  </div>`;
}
function bindWelcome() {
  const c = $("#consent");
  if (c) c.addEventListener("change", () => { consentTicked = c.checked; render(); });
}

function startParticipant() {
  if (!consentTicked) return;
  consentTicked = false;
  const order = shuffle(codes());
  cur = { id: nextId(), startedAt: nowISO(), finishedAt: null, order, sort: order.slice(),
          weakest: null, preferred: null, strongest: null, noneAcceptable: false, tip: {}, match: {}, comment: "" };
  touch();
  go({ name: "run", step: "sort" });
}
function stepIndex() { return STEPS.indexOf(view.step); }
function tipCodes() {
  if (!cur || cur.noneAcceptable) return [];
  return [...new Set([cur.weakest, cur.preferred].filter(Boolean))];
}
function marksProblem() {
  if (cur.noneAcceptable) return "";
  if (!cur.weakest || !cur.preferred || !cur.strongest) return "Choose one box for each of the three questions.";
  const p = c => cur.sort.indexOf(c);
  if (!(p(cur.weakest) <= p(cur.preferred) && p(cur.preferred) <= p(cur.strongest)))
    return "These don't match your order from the last step: the weakest you'd accept can't come after your choice, and your choice can't come after the strongest you'd accept. Change a pick, or tap Back and re-sort.";
  return "";
}
function stepReady() {
  switch (view.step) {
    case "marks": return !marksProblem();
    case "tip": return tipCodes().every(c => cur.tip[c]);
    case "match": return cur.order.every(c => cur.match[c] !== undefined);
    default: return true;
  }
}

function viewRun() {
  const i = stepIndex();
  const last = i === STEPS.length - 1;
  nav([
    i === 0 ? { label: "Stop", act: "quit", cls: "danger" } : { label: "Back", act: "back" },
    { label: last ? "Finish" : "Next", act: last ? "finish" : "next", cls: "primary", disabled: !stepReady() },
  ]);
  const pct = Math.round(((i + 1) / STEPS.length) * 100);
  const head = `<div class="spread small muted"><span>Step ${i + 1} of ${STEPS.length}</span>
                ${i > 0 ? `<button class="ghost danger small" data-act="quit" style="min-height:36px;padding:4px 10px">Stop and delete my answers</button>` : ""}</div>
                <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>`;
  return head + ({ sort: runSort, marks: runMarks, tip: runTip, match: runMatch, comment: runComment }[view.step])();
}

function runSort() {
  const n = cur.sort.length;
  return `
  <h2>Put the boxes in order, weakest to strongest</h2>
  <p>Open each lettered box on the table a few times. Imagine the catch on <b>${esc(db.config.frame)}</b>.
     Then use the arrows to move each letter up (weaker) or down (stronger).</p>
  <div class="endlabel">Weakest</div>
  <ol class="sortlist">
    ${cur.sort.map((c, k) => `
      <li>
        <span class="pos">${k + 1}</span><span class="code">${esc(c)}</span>
        <span class="arrows">
          <button data-act="up" data-k="${k}" aria-label="Move ${esc(c)} weaker" ${k === 0 ? "disabled" : ""}>▲</button>
          <button data-act="down" data-k="${k}" aria-label="Move ${esc(c)} stronger" ${k === n - 1 ? "disabled" : ""}>▼</button>
        </span>
      </li>`).join("")}
  </ol>
  <div class="endlabel">Strongest</div>`;
}

function markRow(field, title, help) {
  return `
  <div class="card">
    <h3 style="margin-top:0">${title}</h3>
    ${help ? `<p class="small muted">${help}</p>` : ""}
    <div class="chips" role="group" aria-label="${esc(title)}">
      ${cur.sort.map(c => `<button class="chip" data-act="mark" data-field="${field}" data-code="${esc(c)}" aria-pressed="${cur[field] === c}" ${cur.noneAcceptable ? "disabled" : ""}>${esc(c)}</button>`).join("")}
    </div>
  </div>`;
}
function runMarks() {
  const prob = marksProblem();
  const anyMark = cur.weakest || cur.preferred || cur.strongest;
  return `
  <h2>Which would you accept on your own box?</h2>
  <p class="muted">The letters are in your order, weakest first. Open the boxes again if you like.</p>
  ${markRow("weakest", "The weakest one you would still accept", "Anything weaker would feel too loose.")}
  ${markRow("preferred", "The one you would choose", "")}

function startDoneTimer() {
  clearInterval(doneTimer);
  let left = DONE_RETURN_S;
  doneTimer = setInterval(() => {
    left--;
    const el = $("#doneCount"); if (el) el.textContent = left;
    if (left <= 0 || view.name !== "done") { clearInterval(doneTimer); if (view.name === "done") go({ name: "welcome" }); }
  }, 1000);
}

/* ---- leaving early: answers are deleted, only a count is kept */
function endEarly(kind) {
  if (!cur) return;
  db.counts[kind] = (db.counts[kind] || 0) + 1;
  save();
  cur = null; hideIdle();
  go({ name: "welcome" });
}

/* ---- inactivity: "Still there?", then reset */
let lastActive = Date.now();
// touch() only records activity. The overlay closes on its own click (below), so the tap that dismisses it can't
// fall through to a survey button underneath.
function touch() { lastActive = Date.now(); }
function hideIdle() { $("#idle").classList.add("hidden"); }
$("#idle").addEventListener("click", e => { e.stopPropagation(); touch(); hideIdle(); });
setInterval(() => {
  if (!cur || view.name !== "run") { hideIdle(); return; }
  const idle = (Date.now() - lastActive) / 1000;
  const limit = db.config.idleSeconds;
  if (idle >= limit + GRACE_S) { endEarly("timedOut"); return; }
  if (idle >= limit) {
    $("#idle").classList.remove("hidden");
    $("#idleCount").textContent = Math.max(0, Math.ceil(limit + GRACE_S - idle));
  }
}, 1000);
["pointerdown", "keydown", "input", "scroll", "touchstart"].forEach(ev => window.addEventListener(ev, touch, { passive: true, capture: true }));

/* ---- results */
function analyse() {
  const rows = db.participants.map(p => {
    const lo = p.noneAcceptable ? NaN : forceOf(p.weakest);
    const pr = p.noneAcceptable ? NaN : forceOf(p.preferred);
    const hi = p.noneAcceptable ? NaN : forceOf(p.strongest);
    return { p, lo, pr, hi, tau: kendall(p.sort || []) };
  });
  const anchorForces = [0, 1, 2, 3, 4].map(k => db.participants.flatMap(p => Object.entries(p.match || {}).filter(([, v]) => v === k).map(([c]) => forceOf(c))));
  return { rows, anchorForces };
}

function chartSVG(rows) {
  const ok = rows.filter(r => Number.isFinite(r.lo) && Number.isFinite(r.hi));
  if (!ok.length) return "";
  const allF = db.config.codes.map(c => parseFloat(c.force)).filter(Number.isFinite);
  const max = Math.max(...allF, ...ok.map(r => r.hi)) * 1.08;
  const W = 400, L = 40, R = 12, rowH = 22, T = 10, H = T + ok.length * rowH + 30;   // narrow: stays legible on phones
  const x = v => L + (v / max) * (W - L - R);
  const step = max > 12 ? 2 : 1;
  let ticks = ""; for (let v = 0; v <= max; v += step) ticks += `<line x1="${x(v)}" x2="${x(v)}" y1="${T}" y2="${H - 24}" stroke="var(--line)"/><text x="${x(v)}" y="${H - 10}" text-anchor="middle">${v}</text>`;
  const medLo = median(ok.map(r => r.lo)), medHi = median(ok.map(r => r.hi));
  const band = Number.isFinite(medLo) && Number.isFinite(medHi) && medHi > medLo
    ? `<rect x="${x(medLo)}" y="${T}" width="${x(medHi) - x(medLo)}" height="${H - 24 - T}" fill="var(--accent-soft)"/>` : "";
  const bars = ok.map((r, i) => {
    const y = T + i * rowH + rowH / 2;
    return `<text x="${L - 8}" y="${y + 4}" text-anchor="end">${esc(r.p.id)}</text>
            <line x1="${x(r.lo)}" x2="${x(r.hi)}" y1="${y}" y2="${y}" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
            ${Number.isFinite(r.pr) ? `<circle cx="${x(r.pr)}" cy="${y}" r="6" fill="var(--card)" stroke="var(--bad)" stroke-width="3"/>` : ""}`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Acceptable range per participant in newtons">${band}${ticks}${bars}
          <text x="${L - 12}" y="${H - 10}" text-anchor="end">N</text></svg>
          <p class="small muted">Bars: weakest to strongest box each person would accept. Ring: their choice. Shaded: median weakest-accepted to median strongest-accepted.</p>`;
}

function viewResults() {
  nav([{ label: "Back", act: "staff" }]);
  const { rows, anchorForces } = analyse();
  const n = rows.length;
  const dropped = `${db.counts.withdrawn} stopped, ${db.counts.timedOut} walked away (answers deleted)`;
  if (!n) return `<h2>Results</h2><div class="card"><p class="muted">No completed responses yet. ${dropped}.</p></div>`;
  const forcesSet = db.config.codes.every(c => Number.isFinite(parseFloat(c.force)));
  const lo = rows.map(r => r.lo), pr = rows.map(r => r.pr), hi = rows.map(r => r.hi);
  const taus = rows.map(r => r.tau).filter(Number.isFinite);
  const perfect = rows.filter(r => r.tau === 1).length;
  const labels = matchLabels();
  const tipAll = db.participants.flatMap(p => Object.entries(p.tip || {}));
  const opened = tipAll.filter(([, v]) => v === "opened");
  const anchorMed = anchorForces.map(median);
  const inOrder = [anchorMed[1], anchorMed[2], anchorMed[3]].filter(Number.isFinite).every((v, i, a) => i === 0 || v >= a[i - 1]);
  return `
  <h2>Results</h2>
  <p class="small muted">${n} completed · ${dropped}</p>
  ${forcesSet ? "" : `<div class="warn">Some box forces are missing (Setup). Values in newtons appear only for boxes with a force.</div>`}
  <div class="stats">
    <div class="stat"><span>Weakest accepted (median)</span><b>${fmtN(median(lo))} N</b><span>range ${fmtN(finiteMin(lo))}–${fmtN(finiteMax(lo))}</span></div>
    <div class="stat"><span>Chosen (median)</span><b>${fmtN(median(pr))} N</b><span>range ${fmtN(finiteMin(pr))}–${fmtN(finiteMax(pr))}</span></div>
    <div class="stat"><span>Strongest accepted (median)</span><b>${fmtN(median(hi))} N</b><span>range ${fmtN(finiteMin(hi))}–${fmtN(finiteMax(hi))}</span></div>
  </div>
  <div class="card">${chartSVG(rows) || `<p class="muted small">The chart appears once forces are entered for the marked boxes.</p>`}</div>

  <div class="card">
    <h3 style="margin-top:0">Can people tell the boxes apart?</h3>
    <p class="small">Sort agreement with the measured forces (Kendall's τ, 1 = perfect): median <b>${fmtN(median(taus))}</b>; ${perfect} of ${n} sorted perfectly.</p>
    <p class="small muted">If neighbouring boxes are often swapped, their forces are too close for people to feel the difference.</p>
    <h3>Shake test</h3>
    <p class="small">${tipAll.length} tests, ${opened.length} opened${opened.length ? ": " + opened.map(([c]) => esc(c)).join(", ") : ""}.</p>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Felt like…</h3>
    <div class="scroll"><table>
      <tr><th>Answer</th><th class="num">Times chosen</th><th class="num">Median force (N)</th></tr>
      ${labels.map((l, k) => `<tr><td>${esc(l)}</td><td class="num">${anchorForces[k].length}</td><td class="num">${fmtN(anchorMed[k])}</td></tr>`).join("")}
    </table></div>
    <p class="small ${inOrder ? "muted" : ""}">${inOrder ? "The comparison closures come out in the expected order." : "<b>Check:</b> the comparison closures' median forces are not in weakest-to-strongest order, so the cues may not be working."}</p>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Responses</h3>
    <div class="scroll"><table>
      <tr><th>ID</th><th>Sorted (weak → strong)</th><th class="num">Accept from</th><th class="num">Choose</th><th class="num">Accept to</th><th class="num">τ</th><th></th></tr>
      ${rows.map(r => `<tr>
        <td>${esc(r.p.id)}</td>
        <td>${(r.p.sort || []).map(esc).join(" ")}</td>
        <td class="num">${r.p.noneAcceptable ? "none" : esc(r.p.weakest) + " · " + fmtN(r.lo)}</td>
        <td class="num">${r.p.noneAcceptable ? "" : esc(r.p.preferred) + " · " + fmtN(r.pr)}</td>
        <td class="num">${r.p.noneAcceptable ? "" : esc(r.p.strongest) + " · " + fmtN(r.hi)}</td>
        <td class="num">${fmtN(r.tau)}</td>
        <td><button class="ghost danger small" data-act="delp" data-id="${esc(r.p.id)}" aria-label="Delete ${esc(r.p.id)}">✕</button></td>
      </tr>`).join("")}
    </table></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Export</h3>
    <div class="row">
      <button class="primary" data-act="csvwide">CSV: one row per person</button>
      <button data-act="csvlong">CSV: one row per box</button>
      <button data-act="exportjson">Back up (JSON)</button>
    </div>
    <p class="small muted">Comments are in the per-person CSV.</p>
  </div>`;
}

function csvWide() {

    "none_acceptable", "weakest_accepted", "chosen", "strongest_accepted", "weakest_accepted_N", "chosen_N", "strongest_accepted_N",
    ...cs.map(c => "shake_" + c), ...cs.map(c => "match_" + c), "comment"];
  const rows = db.participants.map(p => [
    p.id, p.startedAt, p.finishedAt, (p.order || []).join(" "), (p.sort || []).join(" "), fmtN(kendall(p.sort || [])),
    p.noneAcceptable ? "yes" : "no", p.weakest || "", p.preferred || "", p.strongest || "",
    p.noneAcceptable ? "" : fmtN(forceOf(p.weakest)), p.noneAcceptable ? "" : fmtN(forceOf(p.preferred)), p.noneAcceptable ? "" : fmtN(forceOf(p.strongest)),
    ...cs.map(c => (p.tip || {})[c] || ""), ...cs.map(c => { const k = (p.match || {})[c]; return k === undefined ? "" : labels[k]; }),
    p.comment || ""]);
  download(`catch-survey-people-${stamp()}.csv`, toCSV([head, ...rows]), "text/csv");
}
function csvLong() {
  const labels = matchLabels();
  const head = ["participant", "code", "force_N", "listed_position", "sorted_position", "is_weakest_accepted", "is_chosen",
    "is_strongest_accepted", "shake", "match_index", "match_label"];
  const rows = db.participants.flatMap(p => (p.order || []).map(c => {
    const k = (p.match || {})[c];
    return [p.id, c, fmtN(forceOf(c)), p.order.indexOf(c) + 1, (p.sort || []).indexOf(c) + 1,
      p.weakest === c ? 1 : 0, p.preferred === c ? 1 : 0, p.strongest === c ? 1 : 0, (p.tip || {})[c] || "",
      k === undefined ? "" : k, k === undefined ? "" : labels[k]];
  }));
  download(`catch-survey-boxes-${stamp()}.csv`, toCSV([head, ...rows]), "text/csv");
}

  stillhere: () => touch(),
  back: () => { const i = stepIndex(); if (i > 0) go({ name: "run", step: STEPS[i - 1] }); },
  next: () => { if (!stepReady()) return; const i = stepIndex(); go({ name: "run", step: STEPS[i + 1] }); },
  finish: () => {
    cur.finishedAt = nowISO();
    const keep = new Set(tipCodes()); Object.keys(cur.tip).forEach(c => { if (!keep.has(c)) delete cur.tip[c]; });
    db.participants.push(cur); save();
    cur = null; go({ name: "done" }); startDoneTimer();
  },
  up: d => { const k = +d.k; if (k > 0) { [cur.sort[k - 1], cur.sort[k]] = [cur.sort[k], cur.sort[k - 1]]; render(); } },
  down: d => { const k = +d.k; if (k < cur.sort.length - 1) { [cur.sort[k + 1], cur.sort[k]] = [cur.sort[k], cur.sort[k + 1]]; render(); } },
  mark: d => { cur[d.field] = cur[d.field] === d.code ? null : d.code; render(); },
  tip: d => { cur.tip[d.code] = d.v; render(); },
  match: d => { cur.match[d.code] = +d.k; render(); },
  addcode: () => {
    const used = new Set(codes());
    const c = [...LETTERS].find(l => !used.has(l));
    if (!c) return;
    if (db.participants.length && !confirm("Responses exist. Add a box anyway?")) return;
    db.config.codes.push({ code: c, force: "" }); save(); render();
  },
  delcode: d => {
    const c = db.config.codes[+d.i];
    if (!confirm(`Remove box ${c.code}?${db.participants.length ? " Earlier responses that used it keep their answers, but its force will no longer be known." : ""}`)) return;
    db.config.codes.splice(+d.i, 1); save(); render();
  },
  delp: d => { if (confirm(`Delete response ${d.id}? This cannot be undone.`)) { db.participants = db.participants.filter(p => p.id !== d.id); save(); render(); } },
  wipe: () => { if (confirm("Delete ALL responses on this device? Export first if you need them. This cannot be undone.")) { db.participants = []; db.counts = { withdrawn: 0, timedOut: 0 }; save(); render(); } },
  exportjson: () => download(`catch-survey-backup-${stamp()}.json`, JSON.stringify(db, null, 2), "application/json"),
  csvwide: () => csvWide(),
  csvlong: () => csvLong(),
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) fn(el.dataset);
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && view.name === "gate") { e.preventDefault(); actions.unlock(); } });
window.addEventListener("beforeunload", e => { if (cur) { e.preventDefault(); e.returnValue = ""; } });

/* offline use after the first visit (HTTPS or localhost only) */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
render();
</script>
</body>
